const TeacherRoomView = ({

  onUpdateStudent,

}) => {

  const [editingStudent, setEditingStudent] = useState(null);
  const [inputScore, setInputScore] = useState("");
  const total = students.length;
  const completedList = students.filter((s) => s.skor !== null);
  const completedCount = completedList.length;
  const passedCount = students.filter((s) => s.status === "Tuntas").length;
  const remedialCount = students.filter((s) => s.status === "Remedial").length;
  const notCompletedCount = total - completedCount;
  const averageScore = completedCount > 0 ? Math.round(completedList.reduce((sum, s) => sum + (s.skor || 0), 0) / completedCount) : 0;
  const highestScore = completedCount > 0 ? Math.max(...completedList.map((s) => s.skor || 0)) : 0;
  const lowestScore = completedCount > 0 ? Math.min(...completedList.map((s) => s.skor || 0)) : 0;
  const passPercentage = completedCount > 0 ? Math.round(passedCount / completedCount * 100) : 0;
  const filteredStudents = students.filter((s) => {
    const matchesSearch = s.nama.toLowerCase().includes(searchTerm.toLowerCase()) || s.nis.includes(searchTerm) || s.nisn.includes(searchTerm);
    const matchesStatus = statusFilter === "all" || s.status === statusFilter;
    return matchesSearch && matchesStatus;
  });
  const handleSaveManualScore = (e) => {
    e.preventDefault();
    if (!editingStudent) return;
    const numScore = Number(inputScore);
    if (isNaN(numScore) || numScore < 0 || numScore > 100) {
      alert("Masukkan skor valid antara 0 s.d. 100.");
      return;
    }
    const isPassed = numScore >= settings.kkm;
    const newStatus = isPassed ? "Tuntas" : "Remedial";
    const newPredikat = calculatePredikat(numScore, settings.kkm);
    const updated = {
      ...editingStudent,
      skor: numScore,
      status: newStatus,
      predikat: newPredikat,
      attemptCount: Math.max(editingStudent.attemptCount, 1),
      packageCompleted: editingStudent.packageCompleted || "Manual Guru"
    };
    onUpdateStudent(updated);
    setEditingStudent(null);
  };
  const handleResetSingleStudent = (student) => {
    const confirmReset = window.confirm(
      `Apakah Anda yakin ingin mereset nilai asesmen untuk ${student.nama} (NIS: ${student.nis}) ke status awal?`
    );
    if (!confirmReset) return;
    const updated = {
      ...student,
      skor: null,
      status: "Belum Mengerjakan",
      predikat: "-",
      attemptCount: 0,
      packageCompleted: null,
      reflection: null
    };
    onUpdateStudent(updated);
  };
  const handleExportCsv = () => {
    const headers = ["No", "NIS", "NISN", "Nama Siswa", "Skor Akhir", "KKM", "Status", "Predikat", "Jumlah Percobaan"];
    const rows = students.map((s) => [
      s.no,
      `'${s.nis}`,
      `'${s.nisn}`,
      `"${s.nama}"`,
      s.skor !== null ? s.skor : "-",
      settings.kkm,
      `"${s.status}"`,
      `"${s.predikat}"`,
      s.attemptCount
    ]);
    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map((e) => e.join(","))].join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Rekap_Nilai_IPAS_Kelas_VIa_${settings.location}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };
  return <div className="space-y-8 animate-fadeIn pb-16">
      
      {
    /* Teacher Room Header */
  }
      <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/90 shadow-sm">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-100 pb-5 mb-6">

            <div className="p-3 bg-amber-500 text-emerald-950 rounded-2xl shadow-md">
              <GraduationCap className="w-6 h-6" />

        <div className="pt-2">

          </button>
        </div>
      </div>

    </div>;
};

function App() {
  const [students, setStudents] = useState(() => getStoredStudents());
  const [settings, setSettings] = useState(() => getStoredSettings());
  const [role, setRole] = useState(null);
  const [currentStudent, setCurrentStudent] = useState(null);
  const [activeTab, setActiveTab] = useState("dashboard");
  const [selectedSubBabForQuiz, setSelectedSubBabForQuiz] = useState("sub-a");
  const [viewingReportStudent, setViewingReportStudent] = useState(null);
  const [showClassRecapModal, setShowClassRecapModal] = useState(false);
  useEffect(() => {
    const session = getStoredActiveSession();
    if (session.role === "guru") {
      setRole("guru");
    } else if (session.role === "siswa" && session.studentNis) {
      const found = students.find((s) => s.nis === session.studentNis);
      if (found) {
        setRole("siswa");
        setCurrentStudent(found);
      }
    }
  }, []);
  useEffect(() => {
    if (role === "siswa" && (activeTab === "ruang-guru" || activeTab === "pengaturan")) {
      setActiveTab("dashboard");
    }
  }, [role, activeTab]);
  const handleLoginSiswa = (student) => {
    setRole("siswa");
    setCurrentStudent(student);
    saveStoredActiveSession({ role: "siswa", studentNis: student.nis });
    setActiveTab("dashboard");
  };
  const handleLoginGuru = () => {
    setRole("guru");
    setCurrentStudent(null);
    saveStoredActiveSession({ role: "guru" });
    setActiveTab("dashboard");
  };
  const handleLogout = () => {
    setRole(null);
    setCurrentStudent(null);
    saveStoredActiveSession({ role: null });
    setActiveTab("dashboard");
    setViewingReportStudent(null);
  };
  const handleUpdateStudent = (updatedStudent) => {
    const updatedList = students.map(
      (s) => s.nis === updatedStudent.nis ? updatedStudent : s
    );
    setStudents(updatedList);
    saveStoredStudents(updatedList);
    if (currentStudent && currentStudent.nis === updatedStudent.nis) {
      setCurrentStudent(updatedStudent);
    }
    if (viewingReportStudent && viewingReportStudent.nis === updatedStudent.nis) {
      setViewingReportStudent(updatedStudent);
    }
  };
  const handleSaveSettings = (newSettings) => {
    setSettings(newSettings);
    saveStoredSettings(newSettings);
  };
  const handleResetAllStudents = () => {
    const fresh = resetStoredStudents();
    setStudents(fresh);
    if (currentStudent) {
      const freshCurrent = fresh.find((s) => s.nis === currentStudent.nis) || null;
      setCurrentStudent(freshCurrent);
    }
    setViewingReportStudent(null);
  };
  const handleStartSubBabQuiz = (subBabId) => {
    setSelectedSubBabForQuiz(subBabId);
    setActiveTab("kuis-subbab");
  };
  const handleViewIndividualReport = (student) => {
    setViewingReportStudent(student);
    setActiveTab("hasil-asesmen");
  };
  const handlePrint = () => {
    window.print();
  };
  return <div className="min-h-screen bg-slate-100/70 text-slate-900 font-sans flex flex-col selection:bg-emerald-200 selection:text-emerald-950">
      
      {
    /* App Header */
  }
      <Header
    role={role}
    currentStudent={currentStudent}
    settings={settings}
    activeTab={activeTab}
    onTabChange={(tab) => {
      if (tab !== "hasil-asesmen") {
        setViewingReportStudent(null);
      }
      setActiveTab(tab);
    }}
    onLogout={handleLogout}
  />

      {
    /* Main Content Area */
  }
      <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">
        {role === null ? <LoginModal
    students={students}
    settings={settings}
    onLoginSiswa={handleLoginSiswa}
    onLoginGuru={handleLoginGuru}
  /> : <>
            {activeTab === "dashboard" && <DashboardView
    role={role}
    currentStudent={currentStudent}
    students={students}
    settings={settings}
    onNavigate={(tab) => setActiveTab(tab)}
  />}

            {activeTab === "modul" && <ModuleView
    onStartQuiz={handleStartSubBabQuiz}
  />}

            {activeTab === "kuis-subbab" && <QuizSubBabView
    initialSubBab={selectedSubBabForQuiz}
    onNavigateToAsesmen={() => setActiveTab("asesmen")}
  />}

            {activeTab === "asesmen" && <AssessmentView
    role={role}
    currentStudent={currentStudent}
    settings={settings}
    onUpdateStudent={handleUpdateStudent}
    onNavigateToReport={() => {
      setViewingReportStudent(currentStudent);
      setActiveTab("hasil-asesmen");
    }}
  />}

            {activeTab === "hasil-asesmen" && <StudentReportView
    student={viewingReportStudent || currentStudent}
    settings={settings}
    onBack={() => {
      setViewingReportStudent(null);
      setActiveTab(role === "guru" ? "ruang-guru" : "dashboard");
    }}
    onPrint={handlePrint}
  />}

            {
    /* STRICT RBAC: Ruang Guru & Pengaturan ONLY FOR GURU */
  }
            {role === "guru" && activeTab === "ruang-guru" && <TeacherRoomView
    students={students}
    settings={settings}
    onUpdateStudent={handleUpdateStudent}
    onViewStudentReport={handleViewIndividualReport}
    onPrintClassRecap={() => setShowClassRecapModal(true)}
  />}

            {role === "guru" && activeTab === "pengaturan" && <SettingsView
    settings={settings}
    onSaveSettings={handleSaveSettings}
    onResetAllStudents={handleResetAllStudents}
  />}
          </>}
      </main>

      {
    /* Class Recap Printable Modal (for Teacher) */
  }
      {showClassRecapModal && <ClassRecapPrintModal
    students={students}
    settings={settings}
    onClose={() => setShowClassRecapModal(false)}
    onPrint={handlePrint}
  />}

      {
    /* App Footer */
  }
      <footer className="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 print:hidden mt-auto">
        <div className="max-w-7xl mx-auto px-4 space-y-1">
          <div className="font-semibold text-slate-300">
            Media Pembelajaran Digital Interaktif Mapel IPAS Kelas VI • Bab 4: Kearifan Lokal untuk Persatuan Bangsa
          </div>
          <div>
            Pengembang: <span className="text-emerald-400 font-bold">{settings.teacherName}</span> • Unit Tugas: {settings.schoolName}
          </div>
          <div className="text-[11px] text-slate-500 pt-1">
            Dirancang mandiri, responsif, modern, dan siap tayang di GitHub Pages tanpa backend eksternal.
          </div>
        </div>
      </footer>

    </div>;
}




  const rootElement = document.getElementById('root');
  if (rootElement) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  }
  
    </script>
  </body>
</html>
